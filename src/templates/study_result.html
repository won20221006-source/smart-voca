{% extends "base.html" %}
{% block title %}학습 결과 · 스마트보카{% endblock %}
{% block content %}
<h1>학습 결과</h1>
{% if total %}
<ul>
  <li>학습한 단어: {{ total }}개</li>
  <li>정답: {{ correct }}개</li>
  <li>정답률: {{ accuracy }}%</li>
</ul>
{% else %}
<p>학습한 단어가 없습니다.</p>
{% endif %}
<p><a href="/">단어장으로 돌아가기</a> · <a href="/review">오늘의 복습</a></p>
{% endblock %}
